[package]
name = "specta-elm"
description = "Export your Rust types to Elm"
version = "0.1.0"
authors = ["vivi <javlocan@tutamail.com>", "Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/specta"
documentation = "https://docs.rs/specta-elm/latest/specta-elm"
keywords = ["elm", "specta", "typesafe"]
categories = ["web-programming", "development-tools"]
readme = "README.md"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true

[lints]
workspace = true

[dependencies]
specta = { version = "=2.0.0-rc.28", path = "../specta" }
serde_json = "1"

[dev-dependencies]
specta = { version = "=2.0.0-rc.28", path = "../specta", features = ["derive"] }
insta = "1.48.0"
tempfile = "3.27.0"
