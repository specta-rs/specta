name: Issue triage

# Duplicate detection, a sandboxed reproduction attempt, and — when the defect
# really does reproduce — a draft pull request with a candidate fix.
#
# Threat model, setup and the permissions per job live in
# .github/issue-triage/README.md. Read that before changing anything here.
#
# The trust boundary is drawn job by job. A job gets at most one of:
#   * a GitHub token          (collect, comment, publish)
#   * access to the model     (triage, fix)
#   * the ability to execute code from the report (reproduce, verify)
# The last two never overlap, and the model jobs hold no GitHub token at all.
# The model key itself is not in the agent's environment either: a loopback
# proxy injects it, so a compromised agent finds a metered endpoint rather than
# a credential.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
      force:
        description: Ignore the existing triage comment and run again
        required: false
        type: boolean
        default: false

# Nothing is granted unless a job below opts in.
permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  # Model configuration is repository configuration, not code. Set
  # OPENCODE_MODEL (and optionally OPENCODE_BASE_URL) under Settings → Variables
  # to change models without editing this file.
  OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'kimi-k3' }}
  # Optional. The full OpenAI-compatible base URL the proxy forwards to, for a
  # gateway other than the catalog. Unset means Console.
  OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
  OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '2.2.7' }}
  TRIAGE_FULL_SUITE: ${{ vars.TRIAGE_FULL_SUITE || 'true' }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
  REPO: ${{ github.repository }}
  TRIAGE_FORCE: ${{ inputs.force || 'false' }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '0'

jobs:
  # The only job that reads the issue. It holds a read-only token and runs
  # nothing: what it reads is handed to the model job through step outputs.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: read
    outputs:
      decision: ${{ steps.collect.outputs.decision }}
      reason: ${{ steps.collect.outputs.reason }}
      issue: ${{ steps.collect.outputs.issue }}
      candidates: ${{ steps.collect.outputs.candidates }}
      candidate_numbers: ${{ steps.collect.outputs.candidate_numbers }}
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Read the issue
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node repo/.github/issue-triage/collect.mjs

  # The model phase. No GitHub token, no shell, no repository write: the only
  # thing reachable is a loopback proxy that can spend a bounded number of
  # model requests.
  triage:
    needs: collect
    if: needs.collect.outputs.decision == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    outputs:
      decision: ${{ steps.triage.outputs.decision }}
      result: ${{ steps.triage.outputs.result }}
      kind: ${{ steps.triage.outputs.kind }}
      spec: ${{ steps.triage.outputs.spec }}
      diagnosis: ${{ steps.triage.outputs.diagnosis }}
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Install OpenCode
        run: |
          curl --fail --silent --show-error --location https://opencode.ai/v2/install \
            | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Triage
        id: triage
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ISSUE_B64: ${{ needs.collect.outputs.issue }}
          CANDIDATES_B64: ${{ needs.collect.outputs.candidates }}
          CANDIDATE_NUMBERS_B64: ${{ needs.collect.outputs.candidate_numbers }}
        run: node repo/.github/issue-triage/triage.mjs repo

  # Builds and runs the reproduction. This is the job that executes untrusted
  # code, and it holds no token and no secret whatsoever.
  reproduce:
    needs: triage
    if: needs.triage.outputs.decision == 'reproduce'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    outputs:
      reproduced: ${{ steps.run.outputs.reproduced }}
      kind: ${{ steps.run.outputs.kind }}
      log: ${{ steps.run.outputs.log }}
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Attempt reproduction
        id: run
        env:
          REPRO_SPEC_B64: ${{ needs.triage.outputs.spec }}
        run: node repo/.github/issue-triage/repro.mjs reproduce repo

  # Proposes a patch. Same boundary as triage: the proxy is its only credential.
  fix:
    needs: [collect, triage, reproduce]
    if: needs.reproduce.outputs.reproduced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    outputs:
      ok: ${{ steps.fix.outputs.ok }}
      patch: ${{ steps.fix.outputs.patch }}
      diagnosis: ${{ steps.fix.outputs.diagnosis }}
      notes: ${{ steps.fix.outputs.notes }}
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Install OpenCode
        run: |
          curl --fail --silent --show-error --location https://opencode.ai/v2/install \
            | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Propose a fix
        id: fix
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ISSUE_B64: ${{ needs.collect.outputs.issue }}
          REPRO_SPEC_B64: ${{ needs.triage.outputs.spec }}
          REPRO_LOG_B64: ${{ needs.reproduce.outputs.log }}
        run: node repo/.github/issue-triage/fix.mjs repo

  # Applies the patch and runs the reproduction plus the workspace suite. Again
  # no token and no secret, because this executes code.
  verify:
    needs: [triage, reproduce, fix]
    if: needs.fix.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions: {}
    outputs:
      verified: ${{ steps.run.outputs.verified }}
      log: ${{ steps.run.outputs.log }}
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Setup
        run: sudo apt-get update && sudo apt-get install libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev
      # `tests/tests/java.rs` shells out to `javac` and fails when it is absent,
      # exactly like the `build` job in ci.yml.
      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Verify the fix
        id: run
        env:
          REPRO_SPEC_B64: ${{ needs.triage.outputs.spec }}
          PATCH_B64: ${{ needs.fix.outputs.patch }}
        run: node repo/.github/issue-triage/repro.mjs verify repo

  # Every outcome that is not a pull request. Comment only: no secret, no model,
  # and nothing from the report is executed.
  comment:
    needs: [collect, triage, reproduce, fix, verify]
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.decision != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECT_DECISION: ${{ needs.collect.outputs.decision }}
          TRIAGE_DECISION: ${{ needs.triage.outputs.decision }}
          RESULT_B64: ${{ needs.triage.outputs.result }}
          REPRODUCED: ${{ needs.reproduce.outputs.reproduced }}
          REPRO_KIND: ${{ needs.reproduce.outputs.kind }}
          REPRO_LOG_B64: ${{ needs.reproduce.outputs.log }}
          FIX_OK: ${{ needs.fix.outputs.ok }}
          VERIFIED: ${{ needs.verify.outputs.verified }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node repo/.github/issue-triage/comment.mjs

  # The only job that can write to the repository. It runs no code from the
  # report: git apply writes files, nothing here is interpreted.
  publish:
    needs: [collect, triage, reproduce, fix, verify]
    if: needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Clone
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Open a draft pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATCH_B64: ${{ needs.fix.outputs.patch }}
          DIAGNOSIS_B64: ${{ needs.fix.outputs.diagnosis }}
          NOTES_B64: ${{ needs.fix.outputs.notes }}
          REPRO_KIND: ${{ needs.reproduce.outputs.kind }}
        run: node repo/.github/issue-triage/publish.mjs
