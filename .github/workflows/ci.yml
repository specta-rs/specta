name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        env:
          # `assert_runtime_js` skips its runtime assertions unless `node` is on
          # PATH. Runners ship Node, so pin this to turn a missing runtime into
          # a hard failure instead of a silent skip.
          SPECTA_REQUIRE_NODE: 1
        run: cargo test --all-features
      - name: Build without default features
        run: cargo build --all --no-default-features
      - name: Check individually-enabled third-party features
        shell: bash
        run: |
          for feature in bevy_input020 geojson1; do
            cargo check -p specta --no-default-features --features "std,$feature"
          done

  clippy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: sudo apt-get update && sudo apt-get install libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features

  features-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the generated feature list is current
        run: |
          node .github/features.js
          git diff --exit-code specta/src/docs.md

  native-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check for native `links` crates
        run: node .github/links.js

  zod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install Zod test dependencies
        working-directory: tests/zod-typecheck
        run: bun install --frozen-lockfile
      - name: Typecheck and run generated Zod schemas
        working-directory: tests/zod-typecheck
        run: bun run test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install TypeScript test dependencies
        working-directory: tests/typescript-typecheck
        run: bun install --frozen-lockfile
      - name: Typecheck generated TypeScript bindings
        working-directory: tests/typescript-typecheck
        run: bun run test

  rescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install ReScript test dependencies
        working-directory: specta-rescript/examples/generated
        run: bun install --frozen-lockfile
      - name: Format-check and compile generated ReScript
        working-directory: specta-rescript/examples/generated
        run: bun run check

  valibot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install Valibot test dependencies
        working-directory: tests/valibot-typecheck
        run: bun install --frozen-lockfile
      - name: Typecheck and run generated Valibot schemas
        working-directory: tests/valibot-typecheck
        run: bun run test

  # `tests/tests/typescript_precedence.rs` shells out to a TypeScript compiler
  # to assert assignability of the generated types. It skips when no compiler
  # is installed, so this job installs one and pins `SPECTA_TSC` to make a
  # missing compiler a hard failure rather than a silent skip.
  typescript-precedence:
    runs-on: ubuntu-latest
    env:
      SPECTA_TSC: tsc
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install TypeScript
        run: bun install --global typescript@5.9.3
      - name: Typecheck generated TypeScript
        run: cargo test -p specta-tests --test test typescript_precedence

  # `tests/kotlin-typecheck` compiles the generated Kotlin with `kotlinc -Werror` and
  # round-trips the Serde JSON samples. Nothing in `cargo test` needs Kotlin, so the
  # compiler is installed only for this job.
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Kotlin compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile generated Kotlin and round-trip JSON samples
        run: tests/kotlin-typecheck/run.sh
