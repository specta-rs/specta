[package]
name = "specta-csharp"
description = "Export your Rust types to C#"
version = "0.0.6"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/specta"
documentation = "https://docs.rs/specta-csharp/latest/specta-csharp"
keywords = ["specta", "csharp", "dotnet", "typesafe"]
categories = ["development-tools::ffi"]
readme = "../README.md"

[package.metadata."docs.rs"]
all-features = true

[lints]
workspace = true

[dependencies]
specta = { version = "=2.0.0-rc.28", path = "../specta" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", path = "../specta", features = ["derive"] }
specta-serde = { version = "=0.0.15", path = "../specta-serde" }
